<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>BookBox Mobile — корзина</title>
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../wireframe.css">
  <link rel="stylesheet" href="../hifi.css">
  <link rel="stylesheet" href="../mobile.css">
  <link rel="stylesheet" href="../dark.css">
</head>
<body class="theme-wire mobile" data-page="cart">
<!--ICONS-->
<!--HEADER-MOBILE-->

<div class="m-title">Корзина <span class="muted" style="font-size:13px">· 2 книги</span></div>

<div class="m-cart-row">
  <div class="cover cover--1">Мастер и Маргарита</div>
  <div>
    <div class="book-title">Мастер и Маргарита</div>
    <div class="book-author">М. Булгаков</div>
    <div class="qty" style="margin-top:6px;width:fit-content"><span>−</span><span>1</span><span>+</span></div>
  </div>
  <div class="price" style="font-size:13px">24,90</div>
</div>

<div class="m-cart-row">
  <div class="cover cover--2">1984</div>
  <div>
    <div class="book-title">1984</div>
    <div class="book-author">Дж. Оруэлл</div>
    <div class="qty" style="margin-top:6px;width:fit-content"><span>−</span><span>2</span><span>+</span></div>
  </div>
  <div class="price" style="font-size:13px">39,80</div>
</div>

<div class="m-summary">
  <div class="summary-row"><span>Товары</span><span>64,70 BYN</span></div>
  <div class="summary-row"><span>Доставка</span><span>5,00 BYN</span></div>
  <div class="summary-total" style="font-size:15px"><span>Итого</span><span>69,70 BYN</span></div>
  <button class="btn" style="width:100%;height:44px;margin-top:12px">Оформить заказ</button>
</div>

<!--TABBAR-->
<!--INIT-->
</body>
</html>
