<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>BookBox Mobile — фильтры</title>
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../wireframe.css">
  <link rel="stylesheet" href="../hifi.css">
  <link rel="stylesheet" href="../mobile.css">
  <link rel="stylesheet" href="../dark.css">
</head>
<body class="theme-wire mobile" style="padding-bottom:0" data-page="catalog">
<!--ICONS-->

<div class="m-sheet">
  <div class="m-sheet-head">
    <span>Фильтры</span>
    <svg class="icon"><use href="#i-x"/></svg>
  </div>
  <div class="m-sheet-body">
    <div class="filter-group">
      <h3>Раздел</h3>
      <label class="check"><span class="box is-on"></span>Художественная<span class="num">248</span></label>
      <label class="check"><span class="box"></span>Научная и учебная<span class="num">412</span></label>
      <label class="check"><span class="box"></span>Детская<span class="num">96</span></label>
      <label class="check"><span class="box"></span>Бизнес<span class="num">74</span></label>
    </div>
    <div class="filter-group">
      <h3>Жанр</h3>
      <label class="check"><span class="box is-on"></span>Классика<span class="num">64</span></label>
      <label class="check"><span class="box"></span>Фэнтези<span class="num">38</span></label>
      <label class="check"><span class="box"></span>Детективы<span class="num">42</span></label>
      <label class="check"><span class="box"></span>Фантастика<span class="num">51</span></label>
    </div>
    <div class="filter-group">
      <h3>Цена, BYN</h3>
      <div class="range"><input value="10" aria-label="Цена от"><span class="muted">—</span><input value="30" aria-label="Цена до"></div>
    </div>
    <div class="filter-group">
      <h3>Наличие</h3>
      <label class="check"><span class="box is-on"></span>В наличии<span class="num">201</span></label>
      <label class="check"><span class="box"></span>Под заказ<span class="num">47</span></label>
    </div>
  </div>
  <div class="m-sheet-foot">
    <button class="btn">Показать 48 книг</button>
  </div>
</div>

<!--INIT-->
</body>
</html>
