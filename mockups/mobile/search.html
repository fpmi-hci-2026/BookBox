<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>BookBox Mobile — поиск</title>
  <link rel="stylesheet" href="../fonts.css">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../wireframe.css">
  <link rel="stylesheet" href="../hifi.css">
  <link rel="stylesheet" href="../mobile.css">
  <link rel="stylesheet" href="../dark.css">
</head>
<body class="theme-wire mobile" data-page="search">
<!--ICONS-->
<!--HEADER-MOBILE-->

<div class="m-search" style="border-color:var(--deep);background:var(--white)">
  <svg class="icon"><use href="#i-search"/></svg>
  <span style="color:var(--ink);font-weight:600">мастер и маргарита</span>
  <span class="scan"><svg class="icon"><use href="#i-x"/></svg></span>
</div>

<div class="m-suggest">
  <div class="m-suggest-label">Книги</div>
  <div class="m-suggest-row"><svg class="icon"><use href="#i-search"/></svg><b>Мастер и Маргарита</b><span class="muted" style="margin-left:auto;font-size:11px">24,90 BYN</span></div>
  <div class="m-suggest-row"><svg class="icon"><use href="#i-search"/></svg>Мастер и Маргарита · подарочное<span class="muted" style="margin-left:auto;font-size:11px">58,00</span></div>

  <div class="m-suggest-label">Авторы</div>
  <div class="m-suggest-row"><svg class="icon"><use href="#i-user-round"/></svg>Михаил Булгаков<span class="muted" style="margin-left:auto;font-size:11px">12 книг</span></div>

  <div class="m-suggest-label">Жанры</div>
  <div class="m-suggest-row"><svg class="icon"><use href="#i-menu"/></svg>Классика<span class="muted" style="margin-left:auto;font-size:11px">64 книги</span></div>

  <div class="m-suggest-label">История запросов</div>
  <div class="m-chips" style="padding:0">
    <span class="m-chip">мастер и маргарита</span>
    <span class="m-chip">достоевский</span>
    <span class="m-chip">учебник математика</span>
  </div>
</div>

<!--TABBAR-->
<!--INIT-->
</body>
</html>
