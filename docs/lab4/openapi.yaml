          description: Список уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
              examples:
                default:
                  $ref: '#/components/examples/NotificationListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/notifications/{notificationId}:
    parameters:
      - $ref: '#/components/parameters/NotificationId'
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Отметить уведомление прочитанным
      description: Идемпотентно устанавливает состояние прочтения.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
            examples:
              default:
                $ref: '#/components/examples/UpdateNotificationRequestExample'
      responses:
        '200':
          description: Уведомление обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
              examples:
                default:
                  $ref: '#/components/examples/NotificationExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/books:
    post:
      tags: [Admin]
      operationId: createBook
      summary: Добавить книгу в каталог
      description: Требует роль `admin`. ISBN должен быть уникальным.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateBookRequestExample'
      responses:
        '201':
          description: Книга создана
          headers:
            Location:
              description: Адрес созданной книги
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
              examples:
                default:
                  $ref: '#/components/examples/BookDetailExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    patch:
      tags: [Admin]
      operationId: updateBook
      summary: Изменить данные или доступность книги
      description: Требует роль `admin`. Передаются только изменяемые поля.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookRequest'
            examples:
              default:
                $ref: '#/components/examples/UpdateBookRequestExample'
      responses:
        '200':
          description: Книга обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
              examples:
                default:
                  $ref: '#/components/examples/BookDetailExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/orders/{orderId}/ship:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Admin]
      operationId: shipOrder
      summary: Передать оплаченный заказ в доставку
      description: |
        Требует роль `admin`. Допустимый переход: `paid` или `processing` →
        `shipped`. Повтор команды для уже отправленного заказа не создаёт
        повторный переход и возвращает `200` с текущим состоянием.
      responses:
        '200':
          description: Заказ отправлен или уже был отправлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  $ref: '#/components/examples/OrderShippedExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/reviews:
    get:
      tags: [Admin]
      operationId: listReviewsForModeration
      summary: Получить отзывы для модерации
      description: Требует роль `admin`. По умолчанию возвращает отзывы `pending`.
      parameters:
        - name: moderationStatus
          in: query
          description: Фильтр по состоянию модерации
          schema:
            type: string
            enum: [pending, published, rejected]
            default: pending
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список отзывов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
              examples:
                default:
                  $ref: '#/components/examples/ReviewListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/reviews/{reviewId}:
    parameters:
      - $ref: '#/components/parameters/ReviewId'
    patch:
      tags: [Admin]
      operationId: moderateReview
      summary: Опубликовать или отклонить отзыв
      description: Требует роль `admin`. Из `published` или `rejected` отзыв повторно не модерируется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateReviewRequest'
            examples:
              default:
                $ref: '#/components/examples/ModerateReviewRequestExample'
      responses:
        '200':
          description: Состояние модерации обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              examples:
                default:
                  $ref: '#/components/examples/ReviewPublishedExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /analytics/sales:
    get:
      tags: [Analytics]
      operationId: getSalesReport
      summary: Получить агрегаты продаж за период
      description: |
        Требует роль `analyst` (администратору также разрешено). Период
        обязателен, `from` не позже `to`, максимальная длина периода — 366 дней.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: groupBy
          in: query
          description: Группировка временного ряда
          schema:
            type: string
            enum: [day, week, month]
            default: day
          example: day
      responses:
        '200':
          description: Отчёт о продажах
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesReport'
              examples:
                default:
                  $ref: '#/components/examples/SalesReportExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /analytics/sales/export:
    get:
      tags: [Analytics]
      operationId: exportSalesCsv
      summary: Выгрузить продажи за период в CSV
      description: |
        Возвращает тот же набор заказов и период, что и `GET /analytics/sales`
        с той же группировкой. Требует роль `analyst` или `admin`.
      parameters:
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - name: groupBy
          in: query
          schema:
            type: string
            enum: [day, week, month]
            default: day
      responses:
        '200':
          description: CSV-файл с продажами
          headers:
            Content-Disposition:
              description: Имя файла выгрузки
              schema:
                type: string
              example: attachment; filename="bookbox-sales-2026-11-01-2026-11-30.csv"
          content:
            text/csv:
              schema:
                type: string
              example: |
                date,orders,units,revenue
                2026-11-01,12,18,23220.00
                2026-11-02,15,21,27645.50
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT из ответа `/auth/login` или `/auth/register`.
    providerSignature:
      type: apiKey
      in: header
      name: X-Provider-Signature
      description: HMAC-подпись тела webhook-запроса платёжного провайдера.
  parameters:
    Page:
      name: page
      in: query
      description: Номер страницы, начиная с 1
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: Количество элементов на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    BookId:
      name: bookId
      in: path
      required: true
      description: Идентификатор книги (UUID)
      schema:
        type: string
        format: uuid
      example: 3f2b6c1e-8a4d-4c7e-9b1a-2d5e8f7a6c01
    OrderId:
      name: orderId
      in: path
      required: true
      description: Идентификатор заказа (UUID)
      schema:
        type: string
        format: uuid
      example: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f70
    PaymentAttemptId:
      name: paymentAttemptId
      in: path
      required: true
      description: Идентификатор попытки оплаты (UUID)
      schema:
        type: string
        format: uuid
      example: e5f6a7b8-c9d0-4e1f-8a2b-3c4d5e6f7081
    PreorderId:
      name: preorderId
      in: path
      required: true
      description: Идентификатор предзаказа (UUID)
      schema:
        type: string
        format: uuid
      example: f6a7b8c9-d0e1-4f2a-9b3c-4d5e6f708192
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Идентификатор уведомления (UUID)
      schema:
        type: string
        format: uuid
      example: a7b8c9d0-e1f2-4a3b-8c4d-5e6f708192a3
    ReviewId:
      name: reviewId
      in: path
      required: true
      description: Идентификатор отзыва (UUID)
      schema:
        type: string
        format: uuid
      example: b8c9d0e1-f2a3-4b4c-9d5e-6f708192a3b4
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Уникальный ключ запроса оплаты. Повтор с тем же ключом для того же
        заказа возвращает ранее созданную попытку.
      schema:
        type: string
        format: uuid
      example: 1f0e9d8c-7b6a-4c5d-8e9f-0a1b2c3d4e5f
    DateFrom:
      name: from
      in: query
      required: true
      description: Начало периода включительно (YYYY-MM-DD)
      schema:
        type: string
        format: date
      example: 2026-11-01
    DateTo:
      name: to
      in: query
      required: true
      description: Конец периода включительно (YYYY-MM-DD)
      schema:
        type: string
        format: date
      example: 2026-11-30
  responses:
    BadRequest:
      description: Некорректный запрос (например, неверный формат параметра)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/BadRequestExample'
    Unauthorized:
      description: Аутентификация не пройдена или токен недействителен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/UnauthorizedExample'
    Forbidden:
      description: Недостаточно прав для операции
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ForbiddenExample'
    NotFound:
      description: Ресурс не найден или недоступен текущему аккаунту
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/NotFoundExample'
    Conflict:
      description: Конфликт с текущим состоянием ресурса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ConflictExample'
    UnprocessableEntity:
      description: Ошибка валидации полей запроса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/ValidationExample'
    TooManyRequests:
      description: Превышен лимит запросов
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/TooManyRequestsExample'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              $ref: '#/components/examples/InternalErrorExample'
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        code:
          type: string
          example: validation_failed
        instance:
          type: string
          format: uri
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: delivery.city
        message:
          type: string
          example: Поле обязательно
    StockConflictProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            unavailableItems:
              type: array
              items:
                $ref: '#/components/schemas/UnavailableItem'
    UnavailableItem:
      type: object
      required: [bookId, title, requested, available]
      properties:
        bookId:
          type: string
          format: uuid
        title:
          type: string
        requested:
          type: integer
          minimum: 1
        available:
          type: integer
          minimum: 0
    BookSummary:
      type: object
      required: [id, title, price, stock, preorderEnabled, publisher, authors, genres, rating]
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: string
          nullable: true
        title:
          type: string
          maxLength: 300
        publicationYear:
          type: integer
          nullable: true
          minimum: 1
          maximum: 2100
        price:
