openapi: 3.0.3
info:
  title: BookBox API
  version: 1.0.0
  description: |
    Контракт API онлайн-магазина книг BookBox (ЛР4, задания 3–4).
    Спецификация покрывает каталог, аккаунты, корзину, избранное, заказы,
    оплату, предзаказы, уведомления, отзывы, администрирование и аналитику.

    Формат ошибок — `application/problem+json` (RFC 7807). Денежные значения
    передаются числом с двумя знаками после запятой, идентификаторы — UUID,
    время — RFC 3339 в UTC. Аутентификация выполняется Bearer JWT, выданным
    методом `POST /auth/login` или `POST /auth/register`.
  contact:
    name: BookBox team
    url: https://github.com/fpmi-hci-2026/BookBox
  license:
    name: Educational project
    url: https://github.com/fpmi-hci-2026/BookBox
servers:
  - url: https://api.bookbox.example/v1
    description: Проектный адрес production API (заглушка, сервер ещё не развёрнут)
  - url: http://localhost:4010
    description: Локальный Mock-сервер Prism (маршруты без префикса /v1)
tags:
  - name: Catalog
    description: Публичный каталог, карточка книги, справочники
  - name: Auth
    description: Регистрация, вход и профиль текущего аккаунта
  - name: Cart
    description: Корзина текущего покупателя
  - name: Favorites
    description: Избранное текущего покупателя
  - name: Orders
    description: Заказы, оплата и повторные попытки оплаты
  - name: Preorders
    description: Предзаказы на книги
  - name: Notifications
    description: Персональные уведомления
  - name: Reviews
    description: Отзывы покупателей и модерация
  - name: Admin
    description: Административные операции
  - name: Analytics
    description: Аналитика продаж и экспорт CSV
security:
  - bearerAuth: []
paths:
  /books:
    get:
      tags: [Catalog]
      operationId: listBooks
      summary: Получить каталог книг
      description: |
        Возвращает постраничный список книг. Поиск `q` выполняется по названию,
        автору и ISBN. Фильтры можно комбинировать. Доступ не требует входа.
      security: []
      parameters:
        - name: q
          in: query
          description: Текст поиска по названию, автору или ISBN
          schema:
            type: string
            maxLength: 200
          example: булгаков
        - name: genreId
          in: query
          description: Идентификатор жанра
          schema:
            type: string
            format: uuid
          example: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
        - name: publisherId
          in: query
          description: Идентификатор издательства
          schema:
            type: string
            format: uuid
          example: 7c9e2d4a-1b3f-4e5a-8c6d-9f0a1b2c3d4e
        - name: minPrice
          in: query
          description: Минимальная цена включительно
          schema:
            type: number
            format: double
            minimum: 0
          example: 500
        - name: maxPrice
          in: query
          description: Максимальная цена включительно
          schema:
            type: number
            format: double
            minimum: 0
          example: 2000
        - name: inStock
          in: query
          description: Только книги в наличии
          schema:
            type: boolean
          example: true
        - name: sort
          in: query
          description: Сортировка выдачи
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, title, newest]
            default: relevance
          example: price_asc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Постраничный список книг
          headers:
            X-Total-Count:
              description: Общее количество найденных книг
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookList'
              examples:
                default:
                  $ref: '#/components/examples/BookListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /books/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Catalog]
      operationId: getBook
      summary: Получить карточку книги
      security: []
      responses:
        '200':
          description: Карточка книги
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
              examples:
                default:
                  $ref: '#/components/examples/BookDetailExample'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /books/{bookId}/reviews:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [Reviews]
      operationId: listBookReviews
      summary: Получить опубликованные отзывы книги
      description: Публичная выдача содержит только отзывы со статусом `published`.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Постраничный список отзывов и сводка оценок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewList'
              examples:
                default:
                  $ref: '#/components/examples/ReviewListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Reviews]
      operationId: createBookReview
      summary: Отправить отзыв о книге
      description: |
        Требует роль `buyer`. Отзыв создаётся со статусом `pending` и становится
        публичным только после модерации. Повторный отзыв того же покупателя
        на ту же книгу отклоняется с `409`.
      parameters:
        - $ref: '#/components/parameters/BookId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateReviewRequestExample'
      responses:
        '201':
          description: Отзыв создан и ожидает модерации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
              examples:
                default:
                  $ref: '#/components/examples/ReviewPendingExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /genres:
    get:
      tags: [Catalog]
      operationId: listGenres
      summary: Получить справочник жанров
      security: []
      responses:
        '200':
          description: Список жанров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenreList'
              examples:
                default:
                  $ref: '#/components/examples/GenreListExample'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /publishers:
    get:
      tags: [Catalog]
      operationId: listPublishers
      summary: Получить справочник издательств
      security: []
      responses:
        '200':
          description: Список издательств
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherList'
              examples:
                default:
                  $ref: '#/components/examples/PublisherListExample'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Зарегистрировать аккаунт покупателя
      description: |
        Создаёт аккаунт с ролью `buyer` и сразу возвращает JWT. Email
        нормализуется к нижнему регистру и должен быть уникальным.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              default:
                $ref: '#/components/examples/RegisterRequestExample'
      responses:
        '201':
          description: Аккаунт создан, возвращены токен и профиль
          headers:
            Location:
              description: Адрес созданного профиля
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  $ref: '#/components/examples/AuthResponseExample'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти в систему
      description: |
        Проверяет email и пароль. При неверных данных возвращает одинаковый
        ответ `401`, не раскрывая, существует ли аккаунт.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                $ref: '#/components/examples/LoginRequestExample'
      responses:
        '200':
          description: Аутентификация успешна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                default:
                  $ref: '#/components/examples/AuthResponseExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Получить профиль текущего аккаунта
      responses:
        '200':
          description: Профиль текущего аккаунта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                default:
                  $ref: '#/components/examples/AccountExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags: [Auth]
      operationId: updateMe
      summary: Изменить профиль текущего аккаунта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              default:
                $ref: '#/components/examples/UpdateMeRequestExample'
      responses:
        '200':
          description: Профиль обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              examples:
                default:
                  $ref: '#/components/examples/AccountExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/cart:
    get:
      tags: [Cart]
      operationId: getCart
      summary: Получить корзину текущего покупателя
      responses:
        '200':
          description: Текущая корзина
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              examples:
                default:
                  $ref: '#/components/examples/CartExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      operationId: clearCart
      summary: Очистить корзину
      responses:
        '204':
          description: Корзина очищена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/cart/items/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Cart]
      operationId: upsertCartItem
      summary: Добавить книгу в корзину или изменить количество
      description: |
        Идемпотентно устанавливает количество книги в корзине. Если позиции нет,
        она создаётся.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCartItemRequest'
            examples:
              default:
                $ref: '#/components/examples/UpsertCartItemRequestExample'
      responses:
        '200':
          description: Корзина обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
              examples:
                default:
                  $ref: '#/components/examples/CartExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cart]
      operationId: removeCartItem
      summary: Удалить книгу из корзины
      responses:
        '204':
          description: Позиция удалена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/favorites:
    get:
      tags: [Favorites]
      operationId: listFavorites
      summary: Получить избранное текущего покупателя
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список избранных книг
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteList'
              examples:
                default:
                  $ref: '#/components/examples/FavoriteListExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/favorites/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    put:
      tags: [Favorites]
      operationId: addFavorite
      summary: Добавить книгу в избранное
      description: Идемпотентная операция. Повторный вызов не создаёт дубликат.
      responses:
        '204':
          description: Книга добавлена в избранное
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Favorites]
      operationId: removeFavorite
      summary: Удалить книгу из избранного
      responses:
        '204':
          description: Книга удалена из избранного
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/orders:
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: Получить историю заказов текущего покупателя
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу заказа
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Заказы текущего покупателя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
              examples:
                default:
                  $ref: '#/components/examples/OrderListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Оформить заказ из корзины
      description: |
        Сервер повторно проверяет остатки и фиксирует цену каждой позиции.
        Если хотя бы одной книги недостаточно, заказ не создаётся и возвращается
        `409` со списком недоступных позиций. Корзина очищается только при
        успешном создании заказа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateOrderRequestExample'
      responses:
        '201':
          description: Заказ создан и ожидает оплаты
          headers:
            Location:
              description: Адрес созданного заказа
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  $ref: '#/components/examples/OrderExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Заказ не создан: не хватает остатка или корзина пуста.
            В ответе перечислены недоступные позиции.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StockConflictProblem'
              examples:
                insufficientStock:
                  $ref: '#/components/examples/StockConflictExample'
                emptyCart:
                  value:
                    type: https://api.bookbox.example/problems/empty-cart
                    title: Корзина пуста
                    status: 409
                    code: empty_cart
                    detail: Добавьте книги в корзину перед оформлением заказа.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getMyOrder
      summary: Получить детали своего заказа
      description: Чужой заказ возвращает `404`, чтобы не раскрывать его существование.
      responses:
        '200':
          description: Детали заказа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              examples:
                default:
                  $ref: '#/components/examples/OrderExample'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/orders/{orderId}/payment-attempts:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: createPaymentAttempt
      summary: Создать попытку оплаты или повторить оплату
      description: |
        Создаёт попытку оплаты заказа. Заголовок `Idempotency-Key` обязателен:
        повтор с тем же ключом возвращает существующую попытку с `200` и
        заголовком `Idempotent-Replayed: true`, не создавая новую. Новый ключ
        для того же заказа создаёт новую попытку, если заказ ещё не оплачен.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentAttemptRequest'
            examples:
              default:
                $ref: '#/components/examples/CreatePaymentAttemptRequestExample'
      responses:
        '201':
          description: Попытка оплаты создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
              examples:
                default:
                  $ref: '#/components/examples/PaymentAttemptPendingExample'
        '200':
          description: Повтор запроса с тем же Idempotency-Key; возвращена существующая попытка
          headers:
            Idempotent-Replayed:
              description: Признак повторной выдачи существующей попытки
              schema:
                type: boolean
                enum: [true]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
              examples:
                default:
                  $ref: '#/components/examples/PaymentAttemptSucceededExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /payments/{paymentAttemptId}/result:
    parameters:
      - $ref: '#/components/parameters/PaymentAttemptId'
    post:
      tags: [Orders]
      operationId: receivePaymentResult
      summary: Принять результат оплаты от платёжного провайдера
      description: |
        Webhook платёжного провайдера. Подпись передаётся в заголовке
        `X-Provider-Signature`. Повторная доставка того же результата
        обрабатывается идемпотентно и не меняет уже завершённую попытку.
      security:
        - providerSignature: []
      parameters:
        - name: X-Provider-Signature
          in: header
          required: true
          description: HMAC-подпись тела запроса
          schema:
            type: string
          example: sha256=8c1f0a9d4e2b7a6c5d3e1f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderResultRequest'
            examples:
              default:
                $ref: '#/components/examples/ProviderResultRequestExample'
      responses:
        '200':
          description: Результат принят; попытка и заказ обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentAttempt'
              examples:
                default:
                  $ref: '#/components/examples/PaymentAttemptSucceededExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/preorders:
    get:
      tags: [Preorders]
      operationId: listMyPreorders
      summary: Получить предзаказы текущего покупателя
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу предзаказа
          schema:
            $ref: '#/components/schemas/PreorderStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Список предзаказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreorderList'
              examples:
                default:
                  $ref: '#/components/examples/PreorderListExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Preorders]
      operationId: createPreorder
      summary: Оформить предзаказ на книгу
      description: |
        Доступно только для книги с `preorderEnabled: true`. Повторный активный
        предзаказ того же покупателя на ту же книгу возвращает `409`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePreorderRequest'
            examples:
              default:
                $ref: '#/components/examples/CreatePreorderRequestExample'
      responses:
        '201':
          description: Предзаказ создан
          headers:
            Location:
              description: Адрес созданного предзаказа
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preorder'
              examples:
                default:
                  $ref: '#/components/examples/PreorderExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/preorders/{preorderId}:
    parameters:
      - $ref: '#/components/parameters/PreorderId'
    delete:
      tags: [Preorders]
      operationId: cancelPreorder
      summary: Отменить предзаказ
      responses:
        '204':
          description: Предзаказ отменён
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/notifications:
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: Получить уведомления текущего покупателя
      parameters:
        - name: unreadOnly
          in: query
          description: Только непрочитанные уведомления
          schema:
